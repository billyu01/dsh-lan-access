# The dsh-lan-access bundle patch (declared by `dsh.bundle.patch` in
# package.json). A profile layer is applied over the composition built by the
# earlier layers, so mounting a new row means `insert` — an id-targeted patch
# can only override a row that already exists, and an unknown id is skipped
# with a warning.
#
# A deployment composing the plugin by hand adds the same insert to its own
# profile `cordis.patch.yml` (or any later patch layer):
#
#   - insert:
#       - id: lan-access
#         name: dsh-lan-access
#
# One row is enough for both halves: the `client-modules` node half scans host
# rows whose package declares `dsh.client` and serves `exports["./client"]`
# (the `dsh-lan-access/lib/client.js` browser bundle), so no separate client
# row is listed.
#
# The host half reads these services, all present in a stock web profile:
#   - webServer   (index.html polyfill + the /lan control routes)
#   - subprocess  (spawns the per-address reverse proxy)
#   - shell       (detects local IPv4 addresses)
# The browser half injects the `slots` service (shipped by dsh-client-ui-slots).

- insert:
    - id: lan-access
      name: dsh-lan-access
